name: Lighthouse CI

on:
  pull_request:
    branches:
      - main
      - rebuild/from-scratch
  push:
    branches:
      - main
      - rebuild/from-scratch

jobs:
  lhci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lighthouse CI
        env:
          # Placeholder URL — schema is postgres, but Prisma `generate`
          # only needs the env var SET, not connectable. The build step
          # doesn't query the DB.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          UPSTASH_REDIS_KV_REST_API_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_KV_REST_API_TOKEN: placeholder
        run: pnpm dlx @lhci/cli autorun
